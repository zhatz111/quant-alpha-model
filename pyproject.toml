[project]
name = "quant-alpha-model"
version = "0.1.0"
description = "A quantitative research project that develops and backtests a strategy for trading on Polymarket 15-minute crypto markets using statistical arbitrage techniques."
readme = "README.md"
# Your project is compatible with Python 3.11 and newer
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.3",
    "alpaca-py>=0.43.2",
    "arch>=8.0.0",
    "asyncpg>=0.31.0",
    "backtrader>=1.9.78.123",
    "dotenv>=0.9.9",
    "marimo>=0.19.10",
    "matplotlib>=3.10.8",
    "numba>=0.63.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "polars>=1.36.1",
    "polars-ols>=0.3.5",
    "py-builder-relayer-client>=0.0.1",
    "py-clob-client>=0.34.5",
    "pyarrow>=22.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "web3>=7.14.1",
    "websocket-client>=1.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "ruff>=0.14.8",
]
